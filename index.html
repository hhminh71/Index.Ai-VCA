    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */

    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */

        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 13px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }

    <div class="vca-header">

    <div class="main-area">
        <div class="markmap">
            <script type="text/template">
# TỔNG QUAN NĐ 63 & NĐ 55<br>(TÀI SẢN CÔNG & KHO BẠC)
## 1. THÔNG TIN VĂN BẢN
- **Nghị định 63/2019/NĐ-CP**: Quy định gốc về xử phạt VPHC.
- **Nghị định 55/2026/NĐ-CP**: Sửa đổi, bổ sung (Hiệu lực: 09/02/2026).
- **Phạm vi Cảng HKQT Cần Thơ**: Tập trung vào Quản lý TS công, TS Hạ tầng hàng không và giao dịch KBNN.
## 2. NGUYÊN TẮC XỬ PHẠT (BỔ SUNG NĐ 55)
### Về mức phạt (Điều 4)
- **Tổ chức**: Tối đa 100 triệu (TS Công, Kho bạc); 200 triệu (Lãng phí).
- **Cá nhân**: Bằng 1/2 mức phạt của Tổ chức.
- **Vi phạm nhiều lần**: Xử phạt từng lần (trừ một số lỗi phạt 1 lần + tình tiết tăng nặng).
### Về xác định giá trị & Khắc phục
- **Giá trị tài sản**: Tính theo *giá trị còn lại trên sổ kế toán*. Nếu = 0 thì tính = 20% nguyên giá. (Điểm mới)
- **Số lợi bất hợp pháp**: Buộc nộp lại toàn bộ số tiền thu được trừ đi chi phí hợp lý có hóa đơn. (Điểm mới)
## 3. VI PHẠM TÀI SẢN CÔNG (MỨC PHẠT TỔ CHỨC)
### Mua sắm vượt tiêu chuẩn (Điều 6)
- **< 50 triệu**: Phạt 2tr - 5tr
- **50tr - dưới 75tr**: Phạt 5tr - 10tr
- **>= 75 triệu**: Phạt 10tr - 20tr
- *(NĐ 55 làm rõ: Giá trị vượt tính bằng Số lượng vượt x Đơn giá).*
### Giao, sử dụng, hủy hoại tài sản (Điều 8)
- **Giao, nhận không đúng hạn**: Phạt 1tr - 5tr.
- **Giao vượt định mức**: Phạt 2tr - 20tr (Tùy giá trị vượt).
- **Sử dụng sai mục đích (NĐ 55 làm rõ)**:
  - Máy móc, thiết bị: Phạt 5tr - 10tr.
  - Trụ sở làm việc, Xe ô tô (Dùng việc cá nhân): Phạt 10tr - 20tr.
- **Hủy hoại, cố ý làm hư hỏng (MỚI - NĐ 55)**:
  - Máy móc < 50tr: Phạt 2tr - 5tr.
  - Máy móc >= 50tr: Phạt 5tr - 10tr.
  - Trụ sở, Xe ô tô: Phạt 10tr - 20tr. (Kèm buộc khôi phục)
### Tặng cho, Lấn chiếm (Điều 10, 12 - SỬA ĐỔI NĐ 55)
- **Tặng cho sai quy định**: Phạt 2tr - 5tr (<50tr); 5tr - 10tr (50-75tr); 10tr - 50tr (>=75tr).
- **Chiếm đoạt**: Phạt 5tr - 10tr (Máy móc); 10tr - 20tr (Trụ sở, xe).
### Khai thác & Giao TS Hạ tầng (MỚI - NĐ 55)
- **Khai thác TS (Điều 13a)**: Phạt 1tr - 5tr khi chưa có Quyết định phê duyệt.
- **Giao TS Kết cấu hạ tầng (Điều 24a - Lưu ý cho CHK)**: Phạt 1tr - 5tr nếu:
  - Giao khi chưa có Quyết định của cấp có thẩm quyền.
  - Không lập hồ sơ quản lý, kế toán tài sản kết cấu hạ tầng.
## 4. VI PHẠM KHO BẠC NHÀ NƯỚC (SỬA ĐỔI NĐ 55)
### Lập hồ sơ chi NSNN (Điều 54, 55, 56)
- **Chi sai dự toán**: Phạt 2tr - 3tr.
- **Chi khối lượng chưa đủ điều kiện**: Phạt 4tr - 7tr. (Buộc thu hồi)
- **Chi sai hợp đồng (Tài khoản, tỷ lệ)**: Phạt 3tr - 5tr.
- **Lập hồ sơ giả mạo (Chưa đến mức hình sự)**:
  - Sai lệch chứng từ gốc: Phạt 2tr - 4tr.
  - Giả mạo chi thường xuyên: Phạt 10tr - 15tr.
  - Giả mạo chi đầu tư (>500tr): Phạt 30tr - 50tr.
### Thu hồi tạm ứng & Tài khoản (Điều 59, 60 - MỚI NĐ 55)
- **Chậm thu hồi tạm ứng chi đầu tư**: Phạt 1tr - 2tr.
- **Không thu hồi hết tạm ứng (Quá hạn / Đạt 80% hợp đồng)**: Phạt 2tr - 4tr.
- **Vi phạm tài khoản**: Phạt 1tr - 2tr (Cho thuê, mượn; Chậm đối chiếu số dư). (Buộc phong tỏa)
## 5. THẨM QUYỀN LẬP BIÊN BẢN & XỬ PHẠT (CẬP NHẬT NĐ 55)
- **Lập biên bản (Bổ sung)**:
  - Thanh tra viên, Trưởng đoàn thanh tra.
  - Công chức Kho bạc đối chiếu, xác nhận số dư tài khoản.
- **Xử phạt**:
  - Cục trưởng QLCS, Thủ trưởng tổ chức trực thuộc Bộ (phạt tới 100tr).
  - Trưởng đoàn kiểm tra (phạt tới 80-100tr).
  - Bổ sung Giám đốc Kho bạc Nhà nước khu vực.
## 6. LƯU Ý
- **Quản lý Hợp đồng**: Theo dõi sát mốc giải ngân 80% hợp đồng đầu tư để thu hồi dứt điểm tạm ứng NSNN, tránh quá hạn bị phạt.
- **Kinh doanh - Thương mại**: Mọi hoạt động cho thuê, liên doanh mặt bằng nhà ga/đất đai phải hoàn thiện Quyết định khai thác trước khi tiến hành bàn giao cho đối tác.
