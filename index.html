    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;

# 🎯 BỘ GIÁ DVHK & PHI HK <br/>CẢNG HKQT CẦN THƠ <br/>(2025 vs 2026-2027)

## 📚 1. Cơ sở áp dụng
- **Năm 2025:** Quyết định số 948/QĐ-TCTCHKVN (Ký 28/02/2025)
- **Năm 2026-2027:** Quyết định số 590/QĐ-TCTCHKVN (Ký 04/03/2026)

## ✈️ 2. Dịch vụ Hàng không (Giữ nguyên)
- **Phục vụ hành khách:**
  - Quốc tế: 16 USD/khách
  - Quốc nội: 90.909 VNĐ/khách
- **Cất/Hạ cánh & Sân đậu:**
  - Áp dụng chung theo khung giá Cảng Nhóm B.
- **An ninh Hàng không:**
  - Khách QT: 2 USD/khách | Khách NĐ: 18.181 VNĐ/khách
  - Hàng hóa QT: 17 USD/tấn | Hàng hóa NĐ: 140.000 VNĐ/tấn

## 🏪 3. Dịch vụ Phi Hàng không (Điểm nhấn & So sánh)
- **🚗 Dịch vụ dừng, đỗ xe ô tô (QĐ 590/2026):**
  - *10 phút đầu:* Từ 5.000 VNĐ (Xe <9 chỗ, tải <1.5T) đến 25.000 VNĐ (Xe >30 chỗ).
  - *Thuê tháng (NV Cảng/DN):* Tối thiểu từ 100.000đ - 360.000đ/tháng tùy loại xe.
- **🏢 Cho thuê mặt bằng:**
  - Văn phòng: 300.000 VNĐ/m²/tháng (Giữ nguyên).
  - Mặt bằng khác: 200.000 VNĐ/m²/tháng (Giữ nguyên).
- **📺 Dịch vụ Quảng cáo (Thay đổi cấu trúc):**
  - *Giữ nguyên giá cứng:* Panel, Hộp đèn, Màn hình LED, Tivi LCD 75", Decal.
  - *Sự khác biệt 2026:* Các hạng mục quảng cáo nhỏ lẻ (Trưng bày SP, Standee, Tờ rơi, Tạp chí, Quảng cáo ghế ngồi) **đã bị lược bỏ** khỏi bảng giá cứng áp dụng cho Cần Thơ.
  - *Lý do:* Chuyển sang cơ chế Cảng tự lập phương án giá tối thiểu.

## ⚙️ 4. Định hướng triển khai (Phòng TC-KH)
- **📝 Rà soát Hợp đồng:** Cập nhật và gia hạn các hợp đồng DVHK, Phi HK áp dụng chu kỳ giá 2026-2027.
- **📊 Lập phương án giá mới (QUAN TRỌNG):** Chủ trì lập phương án giá tối thiểu cho các dịch vụ bị lược bỏ khỏi bảng giá cứng (Trưng bày SP, Standee, Tờ rơi, Tạp chí,...) trình TCT phê duyệt theo *Quy chế 448 (Điều 12)* và công văn hướng dẫn số 980.
- **💰 Giám sát doanh thu:** Phối hợp các bộ phận liên quan đảm bảo thu đúng barem giá bãi đỗ xe và mặt bằng mới.
