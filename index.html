<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    /* Reset CSS cơ bản */
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      height: 100vh; 
      overflow: hidden; 
      background-color: #ffffff;
    }

    /* Cột bên trái: Thanh Menu */
    .sidebar { 
      width: 300px; 
      background: #f8f9fa; 
      border-right: 1px solid #dadce0; 
      padding: 20px; 
      overflow-y: auto; 
    }
    
    .sidebar-title { 
      font-size: 18px; 
      font-weight: 600; 
      color: #202124; 
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #1a73e8;
    }

    /* Tùy biến cây thư mục */
    ul.tree { 
      list-style-type: none; 
      padding-left: 0; 
      margin: 0;
    }
    ul.tree ul { 
      padding-left: 20px; /* Thụt lề cho thư mục con */
    }
    .tree li { 
      margin: 5px 0;
    }
    .tree-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      cursor: pointer;
      border-radius: 5px;
      color: #3c4043;
      font-size: 14px;
      transition: background 0.2s;
    }
    .tree-item:hover { 
      background-color: #e8f0fe; 
      color: #1a73e8;
    }
    .tree-item.active {
      background-color: #e2eeff;
      color: #1a73e8;
      font-weight: bold;
    }
    .folder-icon { margin-right: 8px; font-size: 16px; }

    /* Cột bên phải: Hiển thị Drive */
    .content { 
      flex-grow: 1; 
      padding: 0; 
      background-color: #f1f3f4;
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

  <!-- CỘT TRÁI -->
  <div class="sidebar">
    <div class="sidebar-title">📂 Cấu trúc Tài liệu</div>
    
    <!-- CÂY THƯ MỤC TÙY BIẾN -->
    <ul class="tree">
      
      <!-- Thư mục cha 1 -->
      <li>
        <div class="tree-item" onclick="loadFolder('1G_ydDQIXjnIQlHl56NOopOG_Bq_KO7eR', this)">
          <span class="folder-icon">📁</span> Hồ sơ Thiết kế
        </div>
      </li>

      <!-- Thư mục cha 2 có thư mục con -->
      <li>
        <div class="tree-item">
          <span class="folder-icon">📂</span> Dự án Sửa chữa hạ tầng
        </div>
        <ul>
          <!-- Thư mục con -->
          <li>
            <div class="tree-item" onclick="loadFolder('ID_THƯ_MỤC_MÁI_CHE', this)">
              <span class="folder-icon">📄</span> Hạng mục Mái che
            </div>
          </li>
          <li>
            <div class="tree-item" onclick="loadFolder('ID_THƯ_MỤC_BÃI_XE', this)">
              <span class="folder-icon">📄</span> Hạng mục Bãi xe
            </div>
          </li>
        </ul>
      </li>

      <!-- Thư mục cha 3 -->
      <li>
        <div class="tree-item" onclick="loadFolder('ID_THƯ_MỤC_CỦA_BẠN', this)">
          <span class="folder-icon">📁</span> Báo cáo nghiệm thu
        </div>
      </li>

    </ul>
  </div>

  <!-- CỘT PHẢI -->
  <div class="content">
    <iframe id="drive-frame" src=""></iframe>
  </div>

  <!-- SCRIPT XỬ LÝ SỰ KIỆN -->
  <script>
    // Hàm được gọi khi click vào 1 thư mục bên trái
    function loadFolder(folderId, element) {
      if (!folderId) return;

      // 1. Highlight thư mục đang chọn
      document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      // 2. Gắn link vào iframe bên phải
      // Sử dụng view nhúng của Google (thêm #grid để hiển thị dạng lưới, hoặc #list để hiển thị dạng danh sách)
      const iframe = document.getElementById('drive-frame');
      iframe.src = "https://drive.google.com/embeddedfolderview?id=" + folderId + "#list";
    }

    // Tự động load thư mục mặc định khi vừa mở web
    window.onload = function() {
      // Thay ID dưới đây bằng ID thư mục bạn muốn hiện đầu tiên
      loadFolder('ID_THƯ_MỤC_MẶC_ĐỊNH', document.querySelectorAll('.tree-item')[0]);
    };
  </script>

</body>
</html>
