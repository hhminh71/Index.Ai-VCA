# NĐ 69/2026/NĐ-CP<br>(Sửa đổi NĐ 106/2025 PCCC & CNCH)
## 1. THÔNG TIN CHUNG & HIỆU LỰC
- **Cơ quan ban hành:** Chính phủ
- **Ngày hiệu lực:** 20/04/2026
- **Áp dụng chuyển tiếp:** Áp dụng quy định để xử lý nếu hành vi vẫn đang diễn ra hoặc quy định cũ nếu có lợi hơn trong quá trình giải quyết khiếu nại.
## 2. NGUYÊN TẮC XỬ PHẠT MỚI (Cập nhật trọng tâm)
- **Vi phạm nhiều lần (Bổ sung khoản 6 Điều 3):**
  - *Quy định mới:* Gộp thành 01 hành vi vi phạm hành chính + Áp dụng tình tiết **TĂNG NẶNG** (Không phạt tách rời từng hành vi như trước).
- **Trách nhiệm thuê/mượn mặt bằng (Bổ sung khoản 7 Điều 3):**
  - Các tổ chức/cá nhân thuê mặt bằng tự chịu trách nhiệm bị xử phạt độc lập tương ứng với hành vi vi phạm của mình.
- **Xử phạt điện tử (Bổ sung khoản 8 Điều 3):**
  - Áp dụng quy trình lập biên bản, xử lý vi phạm trên môi trường điện tử.
## 3. THAY ĐỔI MỨC PHẠT & BIỆN PHÁP (Lưu ý Tài chính)
- **Bảo hiểm cháy nổ bắt buộc (Sửa khoản 1 Điều 17):**
  - Phạt tiền nếu mua không đủ đối tượng hoặc không đúng mức phí.
  - *Biện pháp bổ sung:* Buộc phải nộp tiền mua bổ sung đúng quy định.
- **Thi công & Thẩm duyệt (Sửa khoản 6 Điều 18):**
  - Thay đổi hình thức phạt bổ sung: Đình chỉ hoạt động 01 - 06 tháng (thiếu nghiệm thu) và 03 - 12 tháng (thiếu cả thẩm định & nghiệm thu).
- **Huấn luyện nghiệp vụ (Sửa khoản 4 Điều 6):**
  - Phạt 6 - 8 triệu VNĐ nếu sử dụng nhân sự làm nhiệm vụ PCCC mà chưa có "văn bản thông báo kết quả huấn luyện" (trước đây chỉ ghi là chưa được huấn luyện).
- **Thanh tra & Hồ sơ (Sửa Điều 10):**
  - Phạt nếu không bố trí đúng người có thẩm quyền làm việc với đoàn thanh tra sau khi có thông báo.
- **Trang thiết bị & Duy trì (Sửa Điều 20 & 21):**
  - Bổ sung quy định phạt liên quan đến thiếu trang bị "phương tiện chữa cháy cơ giới".
  - Phạt 3 - 5 triệu nếu không duy trì trữ lượng nước chữa cháy hoặc không đảm bảo kỹ thuật dụng cụ phá dỡ thô sơ.
  - Phạt 5 - 7 triệu nếu không duy trì vách ngăn/cửa ngăn cháy.
## 4. KHUYẾN NGHỊ & TÁC ĐỘNG TỚI CẢNG HKQT CẦN THƠ (VCA)
- **Giao việc cho Tổ Kế hoạch / Ngân sách:**
  - **Dự toán 2026:** Bắt buộc rà soát lại gói thầu Bảo hiểm cháy nổ nhà ga hành khách, nhà điều hành VCA đảm bảo đủ đối tượng và đúng phí (tránh bị phạt và truy thu theo Điều 17 mới).
  - **Ngân sách Đào tạo:** Bố trí quỹ đào tạo, cấp chứng nhận PCCC cho lực lượng PCCC cơ sở & chuyên ngành của Cảng định kỳ.
  - **Ngân sách Bảo trì:** Duy trì trữ lượng nước PCCC, kiểm định/bảo trì xe cứu hỏa (phương tiện cơ giới), hệ thống báo cháy tự động T1.
- **Giao việc cho Tổ Thương mại / Hợp đồng:**
  - Cập nhật Phụ lục Hợp đồng cho thuê mặt bằng (với các Hãng hàng không, đơn vị SASCO, Viags, các quầy bán lẻ tại VCA): Bổ sung điều khoản đối tác **tự chịu trách nhiệm** nộp phạt hành chính về PCCC theo Khoản 7 Điều 3 sửa đổi.
- **Giao việc cho Tổ Đầu tư / Xây dựng:**
  - Bất kỳ dự án sửa chữa, thay đổi công năng nào tại Cảng (mở rộng line soi chiếu, thay đổi quầy hàng) đều phải có văn bản thẩm định/nghiệm thu trước khi hoạt động để tránh rủi ro bị đình chỉ nhà ga (từ 1 - 12 tháng).
