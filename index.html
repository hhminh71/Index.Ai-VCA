<div style="max-width: 600px; margin: 40px auto; padding: 25px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: Arial, sans-serif;">
  <h3 style="margin-top: 0; color: #333; text-align: center;">Hệ thống Rà soát Hồ sơ AI</h3>
  <p style="color: #666; font-size: 14px; text-align: center; margin-bottom: 20px;">Hỗ trợ định dạng PDF. Giới hạn dung lượng: < 15MB</p>
  
  <label style="font-weight: bold; display: block; margin-bottom: 5px;">Email nhận kết quả:</label>
  <input type="email" id="emailInput" placeholder="Nhập email của bạn..." required style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

  <label style="font-weight: bold; display: block; margin-bottom: 5px;">Phân loại tài liệu:</label>
  <select id="loaiHoSo" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
    <option value="Hồ sơ nghiệm thu thi công">Hồ sơ nghiệm thu thi công</option>
    <option value="Bản vẽ kỹ thuật/Biện pháp thi công">Bản vẽ kỹ thuật/Biện pháp thi công</option>
    <option value="Hợp đồng kinh tế">Hợp đồng kinh tế</option>
    <option value="Dự toán">Dự toán/Khối lượng</option>
  </select>

  <label style="font-weight: bold; display: block; margin-bottom: 5px;">Tải file bản scan (PDF):</label>
  <input type="file" id="fileInput" accept="application/pdf" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px dashed #ccc; border-radius: 4px; box-sizing: border-box; background: #f9f9f9;">

  <button onclick="uploadToGemini()" id="submitBtn" style="width: 100%; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Bắt đầu kiểm tra</button>
  
  <div id="statusMessage" style="margin-top: 20px; font-size: 15px; text-align: center; line-height: 1.5;"></div>
</div>

<script>
  // Dán URL Web App bạn copy ở Phần 3 vào đây
  const GAS_URL = "https://script.google.com/macros/s/AKfycbztXWF79JSMvJL7uL0oLLfSr6XM9AZ5xqSk8eaMysTVHGzL1gDrD_OJmvhjGFfJxpk/exec"; 

  function uploadToGemini() {
    const fileInput = document.getElementById('fileInput');
    const email = document.getElementById('emailInput').value;
    const loaiHoSo = document.getElementById('loaiHoSo').value;
    const statusMsg = document.getElementById('statusMessage');
    const btn = document.getElementById('submitBtn');

    if (!fileInput.files.length || !email) {
      alert("Vui lòng điền đủ email và đính kèm file PDF!");
      return;
    }

    const file = fileInput.files[0];
    // Kiểm tra dung lượng (khuyên dùng dưới 15MB để không vượt quá giới hạn payload của Apps Script)
    if (file.size > 15 * 1024 * 1024) {
      alert("File quá lớn! Vui lòng nén file PDF xuống dưới 15MB.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const base64Data = e.target.result;
      
      statusMsg.style.color = "#0056b3";
      statusMsg.innerHTML = "⏳ Đang phân tích hồ sơ qua Gemini...<br><small>Quá trình này có thể mất 30-60 giây tùy độ dài trang.</small>";
      btn.disabled = true;
      btn.style.background = "#ccc";

      const payload = {
        email: email,
        loaiHoSo: loaiHoSo,
        fileName: file.name,
        fileBase64: base64Data
      };

      // Sử dụng text/plain để vượt qua bài toán CORS của Google Apps Script
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload),
        headers: {
          "Content-Type": "text/plain;charset=utf-8",
        }
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === "success") {
          statusMsg.style.color = "green";
          statusMsg.innerHTML = `✅ <b>Hoàn tất!</b> <br><a href="${data.link}" target="_blank" style="color: #d9534f; text-decoration: underline;">Nhấn vào đây để xem Báo cáo QC</a><br><small>Hệ thống cũng đã gửi 1 bản sao qua email của bạn.</small>`;
        } else {
          statusMsg.style.color = "red";
          statusMsg.innerText = "❌ Có lỗi: " + data.message;
        }
        btn.disabled = false;
        btn.style.background = "#0056b3";
      })
      .catch(error => {
        statusMsg.style.color = "red";
        statusMsg.innerText = "❌ Lỗi kết nối máy chủ: " + error.message;
        btn.disabled = false;
        btn.style.background = "#0056b3";
      });
    };

    reader.readAsDataURL(file);
  }
</script>
