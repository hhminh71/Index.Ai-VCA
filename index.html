<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCA Visualizer - Phòng TC-KH</title>
<style>
    /* --- CẤU HÌNH GIAO DIỆN VCA (ACV STYLE) --- */
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; display: flex; flex-direction: column;}
    
    /* Header */
    .vca-header {
        background: #0056b3; /* Xanh ACV */
        color: white;
        padding: 12px 20px;
        border-bottom: 4px solid #d4af37; /* Vàng Gold */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        flex-shrink: 0;
    }
    .vca-top { font-size: 11px; text-transform: uppercase; opacity: 0.8; letter-spacing: 0.5px; }
    .vca-title { font-size: 18px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .vca-badge { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px;}

    /* Main Container */
    .main-area { flex-grow: 1; position: relative; overflow: hidden; }
    
    /* Mindmap container - Full Size */
    .markmap { width: 100%; height: 100vh; }

    /* Footer */
    .vca-footer { 
        background: #e9ecef; color: #555; text-align: center; 
        padding: 5px; font-size: 11px; flex-shrink: 0; border-top: 1px solid #ddd;
    }
</style>
<style>.markmap-node-text { font-family: 'Segoe UI'; font-size: 14px; fill: #333; }</style>
</head>
<body>

    <div class="vca-header">
        <div class="vca-top">Tổng công ty Cảng hàng không Việt Nam - CTCP</div>
        <div class="vca-title">Cảng hàng không quốc tế Cần Thơ</div>
        <div class="vca-badge">Phòng Tài chính - Kế hoạch | Triển khai văn bản</div>
    </div>

    <div class="main-area">
        <div class="markmap">
            <script type="text/template">
# TRIỂN KHAI NGHỊ ĐỊNH 55/2026/NĐ-CP
## 1. Thông tin văn bản
- **Nghị định 55/2026/NĐ-CP** (Sửa đổi NĐ 63/2019/NĐ-CP)
  - Hiệu lực: Từ ngày 09/02/2026
- **Văn bản chỉ đạo**
  - Công văn 1813/BTC-QLCS (Bộ Tài chính)
  - Công văn 3320/BXD-KHTC (Bộ Xây dựng)
## 2. Các hành vi vi phạm (Sửa đổi/Bổ sung)
### Quản lý Tài sản công
- Giao tài sản kết cấu hạ tầng sai quy định
- Không lập hồ sơ quản lý, kế toán tài sản KCHT
- Khai thác tài sản công khi chưa có Quyết định
- Tặng cho tài sản công sai quy định
- Hủy hoại, cố ý làm hư hỏng tài sản công
- Mua sắm, sử dụng vượt tiêu chuẩn, sai mục đích
### Kho bạc Nhà nước
- Vi phạm thời hạn thanh toán thu hồi tạm ứng NSNN
- Đăng ký và sử dụng tài khoản (cho thuê, mượn)
- Lập hồ sơ đề nghị chi sai chế độ, giả mạo
## 3. Cập nhật Thẩm quyền
### Lập biên bản vi phạm
- Bổ sung: Thanh tra viên, Trưởng đoàn thanh tra
- Bổ sung: Công chức đối chiếu tài khoản KBNN
### Xử phạt vi phạm
- Điều chỉnh chức danh Lãnh đạo cấp Sở, Cục
- Điều chỉnh Trưởng đoàn kiểm tra các cấp
- Bổ sung Giám đốc KBNN khu vực
## 4. Nhiệm vụ trọng tâm
- **Tuyên truyền, phổ biến:** Đảm bảo toàn thể CB-NV chịu tác động nắm bắt kịp thời.
- **Quán triệt phòng ngừa:** Lưu ý kỹ các vi phạm mới (Tài sản công, thanh toán tạm ứng) để tránh vi phạm do thiếu thông tin.
- **Rà soát nội bộ:** Đánh giá lại quy trình luân chuyển hồ sơ, quản lý tài sản, thanh toán tại Cảng cho phù hợp.
            </script>
        </div>
    </div>

    <div class="vca-footer">
        Hệ thống hỗ trợ triển khai văn bản nội bộ - VCA
    </div>

    <script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.15.4"></script>

</body>
</html>
