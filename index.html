# QUY HOẠCH CHKQT CẦN THƠ
## 1. Căn cứ & Mục tiêu
- **Mục tiêu quy hoạch:** 5 triệu HK/năm (2030) và 12 triệu HK/năm (2050).
- **Pháp lý:** QĐ 648/QĐ-TTg, NQ 13-NQ/TW của Bộ Chính trị.
- **Định hướng:** Trung tâm logistics, thương mại, dịch vụ hàng không của vùng ĐBSCL.

## 2. Hiện trạng & Dự báo
- **Hiện trạng khai thác:**
  - Khu bay: 1 đường CHC (3000x45m), 5 vị trí đỗ.
  - Khu HKDD: Nhà ga T1 (công suất 3 triệu HK/năm).
- **Dự báo vận tải:**
  - **Đến 2030:** ~5,3 triệu HK/năm; ~60.000 tấn hàng/năm.
  - **Đến 2050:** ~12,2 triệu HK/năm; ~260.000 tấn hàng/năm.
  - Loại tàu bay: Code C (A320/321) và Code E (A350, B787...).

## 3. Phương án Quy hoạch (Phương án 3 - Lựa chọn)
- **Nguyên tắc:** Ưu tiên mở rộng về phía Nam, liền mạch, phát triển logistics.
- **Thời kỳ 2021-2030:**
  - Khu bay: Giữ nguyên 1 đường CHC, bổ sung đường lăn song song. Sân đỗ: 19 vị trí.
  - Nhà ga HK: Nâng cấp T1, xây mới T2. Tổng công suất: 5 triệu HK/năm.
- **Tầm nhìn đến 2050:**
  - Khu bay: Xây đường CHC số 2 (cách CHC 1 là 1512m). Sân đỗ: 32 vị trí.
  - Nhà ga HK: Xây mới T3 (kết nối T2). Tổng công suất: 10-12 triệu HK/năm.
  - Diện tích đất: 760 ha.

## 4. Chi tiết các Khu chức năng
- **Quản lý & Điều hành bay:**
  - Đến 2030: Sử dụng Đài KSKL hiện hữu, đài DVOR/DME.
  - Đến 2050: Bổ sung Radar, AWOS, ILS (CAT II) cho đường CHC 2.
- **Khu phục vụ kỹ thuật & Dịch vụ:**
  - Ga hàng hóa: 60.000 tấn (2030) -> 260.000 tấn (2050).
  - Phụ trợ: Khu sửa chữa (MRO), chế biến suất ăn, kho nhiên liệu (3.000-5.000m3), trạm cứu hỏa (Cấp 9).
- **Giao thông kết nối:**
  - Đường trục: Âu Cơ, Võ Văn Kiệt, nắn tuyến QL 91B.
  - Cầu cạn và Sân đỗ ô tô trước các nhà ga T2, T3.

## 5. Môi trường & Thích ứng BĐKH
- **Đánh giá Môi trường chiến lược (ĐMC):**
  - Quản lý tiếng ồn, kiểm soát khí thải CO2, xử lý nước/rác thải.
- **Thích ứng Biến đổi khí hậu:**
  - Thiết kế cao độ nền +3.00m (chống ngập lụt, triều cường, sụt lún nền).
  - Xử lý nền đất yếu ĐBSCL.

## 6. Khái toán & Nguồn vốn
- **Nhu cầu vốn:**
  - Giai đoạn 2021-2030: ~8.202 tỷ VNĐ.
  - Tầm nhìn 2050: ~18.676 tỷ VNĐ.
  - Tổng cộng: ~26.878 tỷ VNĐ.
- **Phương thức huy động:** Ngân sách Nhà nước, vốn Doanh nghiệp (ACV), PPP và FDI.
