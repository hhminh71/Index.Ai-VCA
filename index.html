# XỬ PHẠT VI PHẠM PCCC & CNCH<br>(NĐ 106/2025/NĐ-CP & NĐ 69/2026/NĐ-CP)
## 1. THÔNG TIN CHUNG
- **NĐ 106/2025/NĐ-CP:** Quy định gốc (Hiệu lực 01/07/2025).
- **NĐ 69/2026/NĐ-CP:** Quy định sửa đổi, bổ sung (Hiệu lực 20/04/2026).
- **Mức phạt với Tổ chức:** Gấp **02 lần** mức phạt của cá nhân (Tối đa lên đến 100 triệu VNĐ/hành vi).
## 2. NGUYÊN TẮC XỬ PHẠT (Cập nhật theo NĐ 69/2026)
- **Vi phạm nhiều lần:** Gộp thành 01 hành vi vi phạm + Áp dụng tình tiết **TĂNG NẶNG**.
- **Trách nhiệm mặt bằng thuê/mượn:** Tổ chức/cá nhân thuê tự chịu trách nhiệm bị xử phạt độc lập với chủ cơ sở.
- **Xử phạt điện tử:** Áp dụng quy trình lập biên bản, quyết định trên môi trường điện tử (Hệ thống CSDL PCCC).
## 3. CÁC NHÓM VI PHẠM & MỨC PHẠT TRỌNG TÂM TẠI CẢNG (VCA)
- **Bảo hiểm cháy, nổ bắt buộc (Điều 17)**
  - Phạt 30 - 50 triệu VNĐ: Không mua bảo hiểm.
  - Phạt *(Bổ sung NĐ 69)*: Mua không đủ đối tượng hoặc sai mức phí + Buộc nộp đủ tiền.
- **Đầu tư, Xây dựng & Cải tạo (Điều 18)**
  - Phạt 15 - 20 triệu VNĐ: Cải tạo, chuyển đổi công năng khi chưa được thẩm định thiết kế.
  - Phạt 40 - 50 triệu VNĐ: Đưa công trình/hạng mục vào sử dụng khi chưa nghiệm thu PCCC.
  - *Hình phạt bổ sung (NĐ 69):* Đình chỉ hoạt động từ 01 - 12 tháng.
- **Bảo trì, Bảo dưỡng thiết bị PCCC (Điều 12, 13, 22)**
  - Phạt 1 - 3 triệu VNĐ: Không kiểm tra, bảo trì hệ thống chống sét định kỳ (Điều 13).
  - Phạt 10 - 20 triệu VNĐ: Không bảo dưỡng hệ thống báo cháy, chữa cháy tự động (Điều 22).
  - Phạt 40 - 50 triệu VNĐ: Không duy trì nguồn điện phục vụ PCCC (Điều 12).
- **Trang bị & Duy trì thiết bị (Điều 20, 21 - Cập nhật NĐ 69)**
  - Phạt 3 - 5 triệu VNĐ: Không duy trì đủ trữ lượng nước chữa cháy hoặc phương tiện phá dỡ thô sơ.
  - Bổ sung mức phạt mới: Phạt nặng hành vi thiếu xe chữa cháy cơ giới (đối với đội PCCC chuyên ngành).
  - Phạt 5 - 7 triệu VNĐ: Không duy trì vách ngăn cháy/cửa ngăn cháy.
- **Huấn luyện & Thực tập phương án (Điều 6, 8, 26)**
  - Phạt 20 - 30 triệu VNĐ: Không thành lập Đội PCCC chuyên ngành (Điều 8).
  - Phạt 15 - 20 triệu VNĐ: Không tổ chức thực tập phương án chữa cháy, CNCH (Điều 26).
  - Phạt *(Bổ sung NĐ 69)*: 6 - 8 triệu VNĐ nếu sử dụng nhân sự làm nhiệm vụ PCCC mà chưa có "văn bản thông báo kết quả huấn luyện".
## 4. NHIỆM VỤ CẢNG HKQT CẦN THƠ (VCA)
- **Kế hoạch / Ngân sách:**
  - **Dự toán hằng năm:** Bắt buộc bố trí quỹ Bảo hiểm cháy nổ nhà ga (đảm bảo đúng đối tượng, chuẩn mức phí theo NĐ 69) và quỹ bồi dưỡng/thực tập PCCC hằng năm.
  - **Ngân sách Bảo trì:** Ưu tiên cấp kinh phí kiểm tra định kỳ chống sét (trước mùa mưa), bảo dưỡng báo cháy/chữa cháy, duy trì trạm bơm, trữ lượng nước và xe chữa cháy chuyên dụng của Cảng.
- **Thương mại / Hợp đồng:**
  - **Rà soát Hợp đồng nhượng quyền/Cho thuê:** Cập nhật ngay điều khoản *"Đối tác tự chịu trách nhiệm trước pháp luật và tự nộp phạt vi phạm hành chính về PCCC trong phạm vi diện tích thuê"* (Theo khoản 7 Điều 3 NĐ 69/2026).
- **Đầu tư / Xây dựng:**
  - **Kiểm soát thanh toán/Giải ngân:** Tuyệt đối không giải ngân 100% hoặc đưa vào sử dụng các hạng mục sửa chữa, thay đổi công năng (như quầy hàng, đảo hành lý, khu soi chiếu) nếu chưa có Văn bản nghiệm thu PCCC, tránh rủi ro bị đình chỉ hoạt động nhà ga.
